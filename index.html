<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookViewer</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BookViewer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<!-- PDF のページを絵にする部品（pdf.js）。一度読みこむと、サービスワーカーがしまっておくので、次からはネットなしで動く -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<!-- ボタンの絵（線の絵にそろえる。Windows・Android・iPad で同じ形に見える） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-folderplus" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14h6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
    <symbol id="i-head" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  </defs>
</svg>

<!-- スマホでブラウザが「デスクトップ版サイト」になっているときのお知らせ -->
<div id="desktopWarn" class="dwarn" hidden>ブラウザが「デスクトップ版サイト」（パソコン用の表示）になっているため、画面がずれます。ブラウザのメニュー（︙）で「デスクトップ版サイト」のチェックを外してください。</div>

<!-- 本棚 -->
<section id="library" class="view">
  <header class="bar">
    <h1>BookViewer</h1>
    <span class="grow"></span>
    <button id="sizeBtn" class="btn" title="表紙の大きさ（スマホは2本指で広げる・つまむ、PC は Ctrl＋ホイールでも）"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span id="sizeLbl" class="lbl">中</span></button>
    <button id="folderNew" class="btn" title="新しいフォルダを作る（本を分けて入れる）"><svg class="ic" aria-hidden="true"><use href="#i-folderplus"/></svg><span class="lbl">新しいフォルダ</span></button>
    <button id="editBtn" class="btn" title="本を移す・消すボタンを出す"><svg class="ic" aria-hidden="true"><use href="#i-edit"/></svg><span id="editLbl" class="lbl">編集</span></button>
    <button id="pickDir" class="btn" title="本の入ったフォルダを選ぶ" hidden><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span id="pickLbl" class="lbl">フォルダを選ぶ</span></button>
    <input id="fileInput" type="file" accept=".zip,.cbz,.pdf,application/zip,application/pdf" multiple hidden>
  </header>
  <div id="dirBar" class="notice" hidden>
    <span id="dirText"></span>
    <button id="dirAllow" class="btn primary" hidden>読みこむ</button>
  </div>
  <div id="libTools" class="ltools" hidden>
    <input id="libSearch" type="search" placeholder="🔍 題名で探す" enterkeyhint="search" autocomplete="off">
    <select id="libSort" class="btn" title="並べ方">
      <option value="recent">読んだ順</option>
      <option value="name">名前の順</option>
      <option value="added">取りこんだ順</option>
      <option value="size">大きい順</option>
    </select>
  </div>
  <div id="folderBar" class="fbar" hidden>
    <button id="folderUp" class="btn"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>本棚</span></button>
    <strong id="folderName" class="grow"></strong>
    <span class="fact">
      <button id="folderRename" class="btn">名前を変える</button>
      <button id="folderDel" class="btn del">フォルダをなくす</button>
    </span>
  </div>
  <p id="libHint" class="hint" hidden></p>
  <div id="books" class="books"></div>
  <p id="storage" class="small"></p>
  <p id="ver" class="small"></p>
  <div id="moveDlg" class="dlgback" hidden>
    <div class="dlg">
      <div class="srow"><strong id="moveTitle" class="grow"></strong><button id="moveClose" class="btn" title="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div id="moveList" class="mlist"></div>
    </div>
  </div>
</section>

<!-- 何巻かのまとめの、巻の一覧 -->
<section id="setView" class="view" hidden>
  <header class="bar">
    <button id="setBack" class="btn"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span>本棚</span></button>
    <h1 id="setTitle" class="settitle"></h1>
  </header>
  <div id="vols" class="books"></div>
</section>

<!-- 読む画面 -->
<section id="reader" class="view" hidden>
  <div id="stage">
    <div id="pages"></div>
  </div>
  <button id="unzoom" class="btn unzoom" title="もとの大きさにもどす（0 キー）" hidden>もとの大きさ</button>
  <div id="loading" class="loading" hidden>読みこんでいます…</div>
  <header id="topBar" class="bar overlay top">
    <button id="back" class="btn" title="本棚にもどる"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span class="lbl">本棚</span></button>
    <span id="title" class="title"></span>
    <button id="searchBtn" class="btn" title="文字で探す（PDF）" hidden><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
    <button id="markBtn" class="btn" title="しおり（B キー）"><svg class="ic" aria-hidden="true"><use href="#i-mark"/></svg></button>
    <button id="viewBtn" class="btn" title="読み方の設定（ページの向き・見開き・余白・色など）"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span class="lbl">表示</span></button>
    <button id="fullBtn" class="btn" title="画面いっぱい" hidden><svg class="ic" aria-hidden="true"><use href="#i-full"/></svg></button>
  </header>
  <!-- 読み方の設定（たまに使うボタンをここにまとめる） -->
  <aside id="viewPanel" class="vpanel" hidden>
    <div class="vhead"><strong class="grow">読み方の設定</strong><button id="viewClose" class="btn" title="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="vrow"><span>ページの向き</span><button id="dirBtn" class="btn" title="右開き／左開き"></button></div>
    <div class="vrow"><span>ページの数</span><button id="spreadBtn" class="btn" title="1ページ／見開き"></button></div>
    <div class="vrow"><span>見開きの組み合わせ</span><button id="shiftBtn" class="btn" title="見開きの組み合わせを1ページずらす（見開きのときだけ）"></button></div>
    <div class="vrow"><span>まわりの余白</span><button id="cropBtn" class="btn" title="ページのまわりの余白を切って、大きく出す"></button></div>
    <div class="vrow"><span>めくる動き</span><button id="flipBtn" class="btn" title="ページをめくる動き"></button></div>
    <div class="vrow"><span>ページの色<small>（全部の本）</small></span><button id="toneBtn" class="btn" title="ページの色（夜に読むとき）"></button></div>
  </aside>
  <div id="searchChip" class="chip" hidden>
    <span id="chipText" class="ctext"></span>
    <button id="chipBack" class="btn tiny primary"></button>
    <button id="chipHere" class="btn tiny">ここから読む</button>
    <button id="chipClear" class="btn tiny">✕ 検索をやめる</button>
  </div>
  <aside id="searchPanel" class="search" hidden>
    <div class="srow">
      <input id="searchInput" type="search" placeholder="探す言葉" enterkeyhint="search" autocomplete="off">
      <button id="searchGo" class="btn primary">探す</button>
      <button id="searchClose" class="btn" title="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="srow small2"><span id="searchStatus" class="sstat"></span><button id="searchClear" class="btn tiny">検索をやめる</button></div>
    <div id="searchList" class="slist"></div>
  </aside>
  <aside id="markPanel" class="search" hidden>
    <div class="srow">
      <strong class="grow">しおり</strong>
      <button id="markClose" class="btn" title="閉じる"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="srow">
      <input id="markMemo" type="text" placeholder="ひとこと（なくてもよい）" enterkeyhint="done" autocomplete="off">
    </div>
    <button id="markAdd" class="btn primary"></button>
    <div class="srow small2"><span id="markStatus" class="sstat"></span></div>
    <div id="markList" class="slist"></div>
  </aside>
  <footer id="bottomBar" class="bar overlay bottom">
    <input id="slider" type="range" min="1" max="1" value="1">
    <span id="pageNo" class="pageno"></span>
  </footer>
</section>

<!-- 聞く画面（BookPlayer の本：音声に合わせて、読んでいる文を明るくする） -->
<section id="listen" class="view" hidden>
  <header class="bar lbar">
    <button id="lsBack" class="btn"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg><span class="lbl">本棚</span></button>
    <div class="ltitles">
      <div id="lsTitle" class="ltitle"></div>
      <select id="lsTrack" aria-label="章"></select>
    </div>
    <button id="lsFull" class="btn" title="本文だけを大きく"><svg class="ic" aria-hidden="true"><use href="#i-full"/></svg></button>
    <button id="lsMenuBtn" class="btn" title="設定"><svg class="ic" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </header>
  <div id="lsStage">
    <div id="lsPages"></div>
    <button id="lsNavPrev" class="lnav left" aria-label="次のページ">‹</button>
    <button id="lsNavNext" class="lnav right" aria-label="前のページ">›</button>
    <div id="lsPageInfo"></div>
    <div id="lsLoading" hidden>読みこんでいます…</div>
    <div id="lsFullCtrl">
      <button id="lsFullPlay" class="btn" aria-label="再生">▶</button>
      <button id="lsFullExit" class="btn" aria-label="もとにもどす">✕</button>
    </div>
  </div>
  <div id="lsPanel">
    <div id="lsLine"></div>
    <div class="seekrow">
      <input id="lsSeek" type="range" min="0" max="1000" value="0" aria-label="位置">
      <span id="lsTime">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <button id="lsPrevS" class="btn" aria-label="前の文">⏮</button>
      <button id="lsBack15" class="btn" aria-label="15秒もどる">−15</button>
      <button id="lsPlay" class="btn primary play" aria-label="再生">▶</button>
      <button id="lsFwd30" class="btn" aria-label="30秒すすむ">＋30</button>
      <button id="lsNextS" class="btn" aria-label="次の文">⏭</button>
    </div>
  </div>
  <div id="lsMenu" hidden>
    <div class="menubox">
      <h2>設定</h2>
      <label>速さ
        <select id="lsSpeed">
          <option>0.8</option><option>0.9</option><option selected>1.0</option><option>1.1</option><option>1.2</option>
          <option>1.3</option><option>1.5</option><option>1.75</option><option>2.0</option>
        </select>
      </label>
      <label>音量 <input id="lsVol" type="range" min="0" max="100" value="100"> <span id="lsVolN">100%</span></label>
      <p class="small" id="lsVolNote">iPad と iPhone では、音量は本体のボタンで変えます。</p>
      <label>見せ方
        <select id="lsHl">
          <option value="dim">まわりを暗くするだけ</option>
          <option value="line">横に太い線</option>
          <option value="pale">うすい蛍光ペン</option>
          <option value="dimpen">まわりを暗く＋蛍光ペン</option>
        </select>
      </label>
      <label>ページ
        <select id="lsSpread">
          <option value="auto">横向きのときは2ページ</option>
          <option value="one">いつも1ページ</option>
        </select>
      </label>
      <button id="lsMenuClose" class="btn primary">閉じる</button>
    </div>
  </div>
  <audio id="lsAudio" preload="auto"></audio>
</section>

<!-- 本を取りこむ（本棚の右下の丸いボタン） -->
<label id="addFab" class="fab" for="fileInput" title="本を取りこむ（ZIP・PDF）"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>本を取りこむ</span></label>

<div id="clock" class="clock" hidden></div>

<script src="app.js"></script>
<script src="listen.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookViewer</title>
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BookViewer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<!-- PDF のページを絵にする部品（pdf.js）。一度読みこむと、サービスワーカーがしまっておくので、次からはネットなしで動く -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

<!-- スマホでブラウザが「デスクトップ版サイト」になっているときのお知らせ -->
<div id="desktopWarn" class="dwarn" hidden>ブラウザが「デスクトップ版サイト」（パソコン用の表示）になっているため、画面がずれます。ブラウザのメニュー（︙）で「デスクトップ版サイト」のチェックを外してください。</div>

<!-- 本棚 -->
<section id="library" class="view">
  <header class="bar">
    <h1>BookViewer</h1>
    <span class="grow"></span>
    <button id="sizeBtn" class="btn" title="表紙の大きさ（スマホは2本指で広げる・つまむ、PC は Ctrl＋ホイールでも）">表示：中</button>
    <button id="folderNew" class="btn" title="本を分けて入れるフォルダを作る">＋📁</button>
    <button id="pickDir" class="btn" hidden>📁 フォルダを選ぶ</button>
    <label class="btn primary" for="fileInput">＋ 本を取りこむ</label>
    <input id="fileInput" type="file" accept=".zip,.cbz,.pdf,application/zip,application/pdf" multiple hidden>
  </header>
  <div id="dirBar" class="notice" hidden>
    <span id="dirText"></span>
    <button id="dirAllow" class="btn primary" hidden>読みこむ</button>
  </div>
  <div id="folderBar" class="fbar" hidden>
    <button id="folderUp" class="btn">‹ 本棚</button>
    <strong id="folderName" class="grow"></strong>
    <span class="fact">
      <button id="folderRename" class="btn">名前を変える</button>
      <button id="folderDel" class="btn del">フォルダをなくす</button>
    </span>
  </div>
  <p id="libHint" class="hint" hidden></p>
  <div id="books" class="books"></div>
  <p id="storage" class="small"></p>
  <p id="ver" class="small"></p>
  <div id="moveDlg" class="dlgback" hidden>
    <div class="dlg">
      <div class="srow"><strong id="moveTitle" class="grow"></strong><button id="moveClose" class="btn" title="閉じる">✕</button></div>
      <div id="moveList" class="mlist"></div>
    </div>
  </div>
</section>

<!-- 何巻かのまとめの、巻の一覧 -->
<section id="setView" class="view" hidden>
  <header class="bar">
    <button id="setBack" class="btn">‹ 本棚</button>
    <h1 id="setTitle" class="settitle"></h1>
  </header>
  <div id="vols" class="books"></div>
</section>

<!-- 読む画面 -->
<section id="reader" class="view" hidden>
  <div id="stage">
    <div id="pages"></div>
  </div>
  <div id="loading" class="loading" hidden>読みこんでいます…</div>
  <header id="topBar" class="bar overlay top">
    <button id="back" class="btn">‹ 本棚</button>
    <span id="title" class="title"></span>
    <button id="searchBtn" class="btn" title="文字で探す（PDF）" hidden>🔍</button>
    <button id="markBtn" class="btn" title="しおり（B キー）">🔖</button>
    <button id="cropBtn" class="btn" title="ページのまわりの余白を切って、大きく出す">余白</button>
    <button id="dirBtn" class="btn" title="右開き／左開き"></button>
    <button id="spreadBtn" class="btn" title="見開き"></button>
    <button id="flipBtn" class="btn" title="ページをめくる動き">めくり</button>
    <button id="toneBtn" class="btn" title="ページの色（夜に読むとき）">色：ふつう</button>
    <button id="shiftBtn" class="btn" title="見開きの組み合わせを1ページずらす">ずらす</button>
    <button id="fullBtn" class="btn" title="画面いっぱい" hidden>⛶</button>
  </header>
  <div id="searchChip" class="chip" hidden>
    <span id="chipText" class="ctext"></span>
    <button id="chipBack" class="btn tiny primary"></button>
    <button id="chipHere" class="btn tiny">ここから読む</button>
    <button id="chipClear" class="btn tiny">✕ 検索をやめる</button>
  </div>
  <aside id="searchPanel" class="search" hidden>
    <div class="srow">
      <input id="searchInput" type="search" placeholder="探す言葉" enterkeyhint="search" autocomplete="off">
      <button id="searchGo" class="btn primary">探す</button>
      <button id="searchClose" class="btn" title="閉じる">✕</button>
    </div>
    <div class="srow small2"><span id="searchStatus" class="sstat"></span><button id="searchClear" class="btn tiny">検索をやめる</button></div>
    <div id="searchList" class="slist"></div>
  </aside>
  <aside id="markPanel" class="search" hidden>
    <div class="srow">
      <strong class="grow">🔖 しおり</strong>
      <button id="markClose" class="btn" title="閉じる">✕</button>
    </div>
    <div class="srow">
      <input id="markMemo" type="text" placeholder="ひとこと（なくてもよい）" enterkeyhint="done" autocomplete="off">
    </div>
    <button id="markAdd" class="btn primary"></button>
    <div class="srow small2"><span id="markStatus" class="sstat"></span></div>
    <div id="markList" class="slist"></div>
  </aside>
  <footer id="bottomBar" class="bar overlay bottom">
    <input id="slider" type="range" min="1" max="1" value="1">
    <span id="pageNo" class="pageno"></span>
  </footer>
</section>

<!-- 聞く画面（BookPlayer の本：音声に合わせて、読んでいる文を明るくする） -->
<section id="listen" class="view" hidden>
  <header class="bar lbar">
    <button id="lsBack" class="btn">‹ 本棚</button>
    <div class="ltitles">
      <div id="lsTitle" class="ltitle"></div>
      <select id="lsTrack" aria-label="章"></select>
    </div>
    <button id="lsFull" class="btn" title="本文だけを大きく">⛶</button>
    <button id="lsMenuBtn" class="btn" title="設定">⚙</button>
  </header>
  <div id="lsStage">
    <div id="lsPages"></div>
    <button id="lsNavPrev" class="lnav left" aria-label="次のページ">‹</button>
    <button id="lsNavNext" class="lnav right" aria-label="前のページ">›</button>
    <div id="lsPageInfo"></div>
    <div id="lsLoading" hidden>読みこんでいます…</div>
    <div id="lsFullCtrl">
      <button id="lsFullPlay" class="btn" aria-label="再生">▶</button>
      <button id="lsFullExit" class="btn" aria-label="もとにもどす">✕</button>
    </div>
  </div>
  <div id="lsPanel">
    <div id="lsLine"></div>
    <div class="seekrow">
      <input id="lsSeek" type="range" min="0" max="1000" value="0" aria-label="位置">
      <span id="lsTime">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <button id="lsPrevS" class="btn" aria-label="前の文">⏮</button>
      <button id="lsBack15" class="btn" aria-label="15秒もどる">−15</button>
      <button id="lsPlay" class="btn primary play" aria-label="再生">▶</button>
      <button id="lsFwd30" class="btn" aria-label="30秒すすむ">＋30</button>
      <button id="lsNextS" class="btn" aria-label="次の文">⏭</button>
    </div>
  </div>
  <div id="lsMenu" hidden>
    <div class="menubox">
      <h2>設定</h2>
      <label>速さ
        <select id="lsSpeed">
          <option>0.8</option><option>0.9</option><option selected>1.0</option><option>1.1</option><option>1.2</option>
          <option>1.3</option><option>1.5</option><option>1.75</option><option>2.0</option>
        </select>
      </label>
      <label>音量 <input id="lsVol" type="range" min="0" max="100" value="100"> <span id="lsVolN">100%</span></label>
      <p class="small" id="lsVolNote">iPad と iPhone では、音量は本体のボタンで変えます。</p>
      <label>見せ方
        <select id="lsHl">
          <option value="dim">まわりを暗くするだけ</option>
          <option value="line">横に太い線</option>
          <option value="pale">うすい蛍光ペン</option>
          <option value="dimpen">まわりを暗く＋蛍光ペン</option>
        </select>
      </label>
      <label>ページ
        <select id="lsSpread">
          <option value="auto">横向きのときは2ページ</option>
          <option value="one">いつも1ページ</option>
        </select>
      </label>
      <button id="lsMenuClose" class="btn primary">閉じる</button>
    </div>
  </div>
  <audio id="lsAudio" preload="auto"></audio>
</section>

<div id="clock" class="clock" hidden></div>

<script src="app.js"></script>
<script src="listen.js"></script>
</body>
</html>
